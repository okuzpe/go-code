# golangci-lint v2 — https://golangci-lint.run/docs/configuration/file/
version: "2"

run:
  relative-path-mode: cfg

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused

  settings:
    errcheck:
      exclude-functions:
        # BubbleTea Cmd returns are intentionally discarded in update loops.
        - (github.com/charmbracelet/bubbletea.Model).Update
    staticcheck:
      checks:
        - "SA*"
        - "S1*"
        - "ST*"
        - "-ST1000"
        - "-ST1020"
        - "-ST1021"

  exclusions:
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: internal/ui/chat/
