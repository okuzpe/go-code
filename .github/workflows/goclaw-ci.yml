# Monorepo root: module lives in goclaw/
name: goclaw CI

on:
  push:
    branches: [master, main]
    paths:
      - "goclaw/**"
      - ".github/workflows/goclaw-ci.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "goclaw/**"
      - ".github/workflows/goclaw-ci.yml"

defaults:
  run:
    working-directory: goclaw

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: goclaw/go.mod
          cache-dependency-path: goclaw/go.sum

      - name: Vet
        run: go vet ./...

      - name: Smoke (--version)
        run: go run ./cmd/goclaw --version

      - name: Test (race on Linux only)
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            go test -race -shuffle=on -timeout 10m -coverpkg=./... -coverprofile=coverage.out ./...
          else
            go test -timeout 10m ./...
          fi

      - name: Check coverage threshold (Linux only)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          total=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${total}%"
          awk -v cov="$total" 'BEGIN { if (cov+0 < 61) { print "Coverage " cov "% is below 61% threshold"; exit 1 } }'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: goclaw/go.mod
          cache-dependency-path: goclaw/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: goclaw
